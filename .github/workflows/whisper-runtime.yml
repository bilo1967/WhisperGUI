name: Build whisper.cpp runtimes
run-name: whisper.cpp 1.9.6 runtimes · ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Keep all verified packages in a dedicated runtime release'
        type: boolean
        default: true
      windows_candidate_run:
        description: 'Optional earlier run ID: retest its Windows candidate without rebuilding'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/whisper-runtime.yml'
      - 'scripts/build-whisper-runtime.py'
      - 'scripts/test_build_whisper_runtime.py'

permissions:
  contents: read

env:
  WHISPER_VERSION: '1.9.6'
  # v1.9.6: build this exact source, independently of changes to upstream tags.
  WHISPER_COMMIT: '96ec4d9823e9d0211944172da35f9f29134af990'
  CUDA_VERSION: '12.4.1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      RUNTIME_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64-cuda, runner: windows-2022 }
          - { target: macos-x64-metal, runner: macos-15-intel }
          - { target: macos-arm64-metal, runner: macos-15 }
          - { target: linux-x64-cpu, runner: ubuntu-22.04 }
          - { target: linux-arm64-cpu, runner: ubuntu-22.04-arm }
    steps:
      - name: Checkout WhisperGUI build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout fixed whisper.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_COMMIT }}
          path: whisper-src
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test runtime build and recovery safeguards
        run: python -m unittest discover -s scripts -p test_build_whisper_runtime.py -v
      - name: Install CUDA-compatible MSVC toolset
        if: matrix.target == 'windows-x64-cuda' && !inputs.windows_candidate_run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # CUDA 12.4 needs MSVC 19.3x; do not bypass NVIDIA's compiler check.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio not found' }
          $installer = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vs_installer.exe"
          $proc = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64', '--quiet', '--norestart', '--nocache') -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 3010)) { throw "MSVC installation failed: $($proc.ExitCode)" }
          if (-not (Test-Path "$vs/VC/Tools/MSVC/14.38.*/bin/Hostx64/x64/cl.exe")) { throw 'MSVC 14.38 was not installed' }
      - name: Install fixed CUDA toolkit
        if: matrix.target == 'windows-x64-cuda' && !inputs.windows_candidate_run
        uses: Jimver/cuda-toolkit@c35baa1a18fd1fc9dcf47c5bd839bf30559c0bc3 # v0.2.24
        with:
          cuda: ${{ env.CUDA_VERSION }}
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          use-github-cache: false
      - name: Install Ninja
        if: matrix.target == 'windows-x64-cuda' && !inputs.windows_candidate_run
        run: choco install ninja -y --no-progress
      - name: Cache Windows compilation like upstream
        if: matrix.target == 'windows-x64-cuda' && !inputs.windows_candidate_run
        uses: ggml-org/ccache-action@1bbbcda0748b3e340dee71a314fa68ffcbd6df79 # v1.2.21
        with:
          key: whisper-${{ env.WHISPER_COMMIT }}-windows-cuda-${{ env.CUDA_VERSION }}-msvc1438-ninja
          max-size: 2G
      - name: Recover previous Windows candidate
        if: matrix.target == 'windows-x64-cuda' && inputs.windows_candidate_run
        uses: actions/download-artifact@v4
        with:
          name: whisper-candidate-${{ env.WHISPER_VERSION }}-windows-x64-cuda
          path: runtime-package
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_candidate_run }}
      - name: Build and stage Windows runtime
        if: matrix.target == 'windows-x64-cuda' && !inputs.windows_candidate_run
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64 -vcvars_ver=14.38
          if errorlevel 1 exit /b %errorlevel%
          python scripts/build-whisper-runtime.py --build-only
      - name: Build and stage Unix runtime
        if: matrix.target != 'windows-x64-cuda'
        run: python scripts/build-whisper-runtime.py --build-only
      - name: Preserve candidate before verification
        uses: actions/upload-artifact@v4
        with:
          name: whisper-candidate-${{ env.WHISPER_VERSION }}-${{ matrix.target }}
          path: runtime-package/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Verify staged runtime and archive
        run: python scripts/build-whisper-runtime.py --verify-only
      - name: Upload verified runtime
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ env.WHISPER_VERSION }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve partial Windows binaries on failure
        if: failure() && matrix.target == 'windows-x64-cuda'
        uses: actions/upload-artifact@v4
        with:
          name: whisper-partial-windows-x64-cuda
          path: whisper-build/bin/Release/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload build and smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-logs-${{ matrix.target }}
          path: |
            runtime-logs/
            whisper-build/CMakeCache.txt
            whisper-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Preserve verified runtimes
    needs: build
    # A failed platform must not prevent preserving the other verified packages.
    if: always() && !cancelled() && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: whisper-${{ env.WHISPER_VERSION }}-*
          path: dist
          merge-multiple: true
      - name: Preserve all available verified packages in a runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd "$GITHUB_WORKSPACE/dist"
          count="$(find . -maxdepth 1 -name '*.zip' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo 'No verified runtime packages to publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq "$count"
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          tag="whisper-runtime-v${WHISPER_VERSION}-build-${GITHUB_RUN_NUMBER}"
          printf 'whisper.cpp %s, source commit %s.\n\nBuilt and smoke-tested by %s/%s/actions/runs/%s.\n\nPackages contain bin/, licenses and BUILD-INFO.json; no models or FFmpeg. GPU execution requires local validation: hosted runners test CPU inference, including the CUDA and Metal packages.\n' \
            "$WHISPER_VERSION" "$WHISPER_COMMIT" 'https://github.com' "$GH_REPO" "$GITHUB_RUN_ID" > notes.txt
          printf '\nVerified packages available: %s of 5. Missing targets failed or did not complete; available packages are preserved independently.\n' "$count" >> notes.txt
          gh release create "$tag" ./*.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "whisper.cpp $WHISPER_VERSION runtimes (build $GITHUB_RUN_NUMBER)" \
            --notes-file notes.txt
